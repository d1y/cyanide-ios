name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        run: ./scripts/build.sh

      - name: Verify IPA exists
        run: |
          IPA="build/Cyanide-${{ steps.tag.outputs.version }}.ipa"
          if [ ! -f "$IPA" ]; then
            echo "error: $IPA not found" >&2
            echo "Make sure MARKETING_VERSION matches tag ${{ github.ref_name }}" >&2
            exit 1
          fi
          ls -lh "$IPA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          IPA="build/Cyanide-${VERSION}.ipa"
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          gh release create "$TAG" "$IPA" \
            --repo "$REPO" \
            --verify-tag \
            --latest \
            --title "Cyanide ${TAG}" \
            --generate-notes
